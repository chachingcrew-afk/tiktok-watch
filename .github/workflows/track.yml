name: Track videos (every 6h)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      products_only:
        description: 'Only refresh TikTok Shop prices and sales'
        type: boolean
        default: false

# collect and track never run at the same time
concurrency:
  group: tiktok-watch-track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python track.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          PRODUCTS_ONLY: ${{ inputs.products_only && '1' || '0' }}
