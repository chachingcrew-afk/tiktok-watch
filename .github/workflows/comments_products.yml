name: Product video comments (hourly)

# Every hour: the relevant comments of the creator videos of the listed products, best sellers first,
# about 35 products per run (comments.py --products). Separate from every other job.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: comments-products
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python comments.py --products
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          COMMENT_PRODUCTS: '35'
          COMMENT_TIME_BUDGET_S: '2700'
