name: Scan TikTok Shop categories (every 2 hours)

# GitHub starts schedules only every few hours, so one run keeps scanning for almost 6 hours:
# a new pass every 2 hours (or right after the previous one, if that took longer). Runs never overlap.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

concurrency:
  group: tiktok-watch-shop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Scan, a pass every 2 hours
        run: |
          while true; do
            start=$SECONDS
            timeout 150m python shop.py || echo "pass ended with an error or over 150 minutes"
            used=$(( SECONDS - start ))
            wait=$(( 7200 - used )); [ $wait -lt 0 ] && wait=0
            # stop when another pass would not fit in the run (about 5 h 45 min with setup)
            if [ $(( SECONDS + wait + 9000 )) -gt 20400 ]; then break; fi
            sleep $wait
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: termekradar-media
          PROXY_URL: ${{ secrets.PROXY_URL }}
