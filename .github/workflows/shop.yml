name: Scan TikTok Shop categories (every 2 hours)

on:
  schedule:
    - cron: '23 */2 * * *'   # every 2 hours: look for new products (GitHub may start it late)
  workflow_dispatch:

concurrency:
  group: tiktok-watch-shop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python shop.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
