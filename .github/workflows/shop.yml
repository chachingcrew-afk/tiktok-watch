name: Scan TikTok Shop categories (twice a day)

on:
  schedule:
    - cron: '23 4,16 * * *'   # twice a day (GitHub may start it a few hours late)
  workflow_dispatch:

concurrency:
  group: tiktok-watch-shop
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python shop.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
