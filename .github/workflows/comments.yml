name: Kit video comments

# Manual only: fetches the relevant comments for product kits that have none yet.
# Kits that already have comments are not fetched again (COMMENT_REFRESH_DAYS), to save proxy traffic.
on:
  workflow_dispatch:

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_comment_filter.py
      - run: python comments.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          COMMENT_REFRESH_DAYS: '3650'
