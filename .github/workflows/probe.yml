name: Probe product page

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Probe script to run'
        type: string
        default: 'probe_product.py'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - if: contains(inputs.script, 'browser')
        run: python -m playwright install --with-deps chromium
      - run: python ${{ inputs.script || 'probe_product.py' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
