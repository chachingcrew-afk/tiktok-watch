name: Parcel tracking (17TRACK)

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  group: parcels
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python track_parcels.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRACK17_KEY: ${{ secrets.TRACK17_KEY }}
