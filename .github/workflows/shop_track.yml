name: Check TikTok Shop sales (every 3 hours)

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

concurrency:
  group: tiktok-watch-shop_track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python shop_track.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SHOP_CONCURRENCY: '16'
          SHOP_PAGE_BUDGET_S: '2700'
