name: Read creator videos of shop products (daily)

on:
  schedule:
    - cron: '13 9 * * *'   # after the morning shop scan
  workflow_dispatch:

concurrency:
  group: tiktok-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python product_videos.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
