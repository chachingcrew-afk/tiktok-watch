name: Facebook ads (Meta Ad Library)

# Every 3 hours (GitHub may start it later): niche keywords, products of the list (best sellers first)
# and watched pages, read from the public Ad Library through the proxy. Separate from every other job.
on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:

concurrency:
  group: fbads
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python fbads.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FB_PRODUCTS: '60'
          FB_TIME_BUDGET_S: '3300'
