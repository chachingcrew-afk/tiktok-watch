name: Facebook ads (Meta Ad Library)

# Niche keywords, products of the list (best sellers first) and watched pages, read from the public Ad Library
# through the proxy. GitHub starts schedules only every few hours, so one run works for up to 5 hours.
on:
  schedule:
    - cron: '29 */3 * * *'
  workflow_dispatch:
    inputs:
      test_query:
        description: 'Only this one search (test)'
        required: false
        default: ''

concurrency:
  group: fbads
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python fbads.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FB_PRODUCTS: '250'
          FB_TEST_QUERY: ${{ inputs.test_query }}
          FB_TIME_BUDGET_S: '17400'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: termekradar-media
